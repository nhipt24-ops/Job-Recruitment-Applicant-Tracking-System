<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job ATS - Hệ thống tuyển dụng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Job ATS</a>
      <div class="d-flex gap-2">
        <a href="/login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>
        <a href="/register.html" class="btn btn-light btn-sm">Đăng ký</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="hero mb-4">
      <h1 class="display-5 fw-bold">Tìm việc làm phù hợp</h1>
      <p class="lead mb-4">Hệ thống tuyển dụng & theo dõi ứng viên - Job Recruitment & Applicant Tracking System</p>
      <div class="row g-2">
        <div class="col-md-5">
          <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Tìm theo vị trí, công ty...">
        </div>
        <div class="col-md-3">
          <input type="text" id="locationInput" class="form-control form-control-lg" placeholder="Địa điểm">
        </div>
        <div class="col-md-2">
          <select id="typeSelect" class="form-select form-select-lg">
            <option value="">Tất cả loại</option>
            <option value="full_time">Full-time</option>
            <option value="part_time">Part-time</option>
            <option value="internship">Internship</option>
            <option value="remote">Remote</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-light btn-lg w-100" onclick="loadJobs()">Tìm kiếm</button>
        </div>
      </div>
    </div>

    <div id="jobList" class="row g-3">
      <div class="col-12 text-center text-muted py-5">Đang tải...</div>
    </div>
  </div>

  <footer class="text-center">
    <div class="container">
      Job Recruitment & Applicant Tracking System &copy; 2026 - Đề tài số 10
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Nếu đã login thì redirect
    const u = getUser();
    if (u) redirectByRole(u.role);

    async function loadJobs() {
      const params = {};
      const s = document.getElementById('searchInput').value.trim();
      const loc = document.getElementById('locationInput').value.trim();
      const type = document.getElementById('typeSelect').value;
      if (s) params.search = s;
      if (loc) params.location = loc;
      if (type) params.job_type = type;

      const list = document.getElementById('jobList');
      list.innerHTML = '<div class="col-12 text-center py-4">Đang tải...</div>';

      try {
        const jobs = await JobsAPI.list(params);
        if (jobs.length === 0) {
          list.innerHTML = '<div class="col-12 text-center text-muted py-5">Không tìm thấy việc làm phù hợp.</div>';
          return;
        }
        list.innerHTML = jobs.map(j => `
          <div class="col-md-6 col-lg-4">
            <div class="card job-card h-100">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title mb-0">${j.title}</h5>
                  ${statusBadge(j.status)}
                </div>
                <p class="text-muted small mb-1"><strong>${j.company_name}</strong></p>
                <p class="small text-muted mb-2">
                  📍 ${j.location || 'Không rõ'} &nbsp;|&nbsp; ${j.job_type}
                </p>
                <p class="fw-semibold text-primary mb-3">${formatSalary(j.salary_min, j.salary_max)}</p>
                <p class="card-text small text-secondary" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                  ${j.description}
                </p>
                <a href="/login.html" class="btn btn-outline-primary btn-sm mt-2">Xem chi tiết & Ứng tuyển</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = `<div class="col-12 alert alert-danger">${e.message}</div>`;
      }
    }

    loadJobs();
  </script>
</body>
</html>
