<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Job ATS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Job ATS - Quản trị viên</a>
      <div class="d-flex align-items-center gap-3 text-white">
        <span id="userName"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Đăng xuất</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 sidebar py-3">
        <nav class="nav flex-column">
          <a class="nav-link active" href="#" data-tab="stats">Thống kê</a>
          <a class="nav-link" href="#" data-tab="users">Quản lý người dùng</a>
        </nav>
      </div>
      <div class="col-md-10 p-4">
        <div id="alertBox"></div>

        <div id="tab-stats">
          <h4 class="mb-4">Thống kê hệ thống</h4>
          <div class="row g-3" id="statsCards">
            <div class="col-md-3"><div class="card stat-card p-3"><div class="text-muted small">Người dùng</div><div class="fs-3 fw-bold" id="s_users">-</div></div></div>
            <div class="col-md-3"><div class="card stat-card p-3"><div class="text-muted small">Công ty</div><div class="fs-3 fw-bold" id="s_companies">-</div></div></div>
            <div class="col-md-3"><div class="card stat-card p-3"><div class="text-muted small">Tin tuyển dụng</div><div class="fs-3 fw-bold" id="s_jobs">-</div></div></div>
            <div class="col-md-3"><div class="card stat-card p-3"><div class="text-muted small">Đơn ứng tuyển</div><div class="fs-3 fw-bold" id="s_apps">-</div></div></div>
          </div>
        </div>

        <div id="tab-users" class="d-none">
          <h4 class="mb-3">Danh sách người dùng</h4>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr><th>ID</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Vai trò</th><th>Ngày tạo</th><th>Thao tác</th></tr>
              </thead>
              <tbody id="userTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const user = requireAuth(['admin']);
    if (!user) throw new Error('auth');
    document.getElementById('userName').textContent = user.full_name;

    document.querySelectorAll('[data-tab]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('[data-tab]').forEach(a => a.classList.remove('active'));
        el.classList.add('active');
        ['stats','users'].forEach(t => {
          document.getElementById('tab-' + t).classList.toggle('d-none', t !== el.dataset.tab);
        });
        if (el.dataset.tab === 'users') loadUsers();
      });
    });

    async function loadStats() {
      try {
        const s = await AdminAPI.stats();
        document.getElementById('s_users').textContent = s.total_users;
        document.getElementById('s_companies').textContent = s.total_companies;
        document.getElementById('s_jobs').textContent = s.total_jobs + ' (open: ' + s.open_jobs + ')';
        document.getElementById('s_apps').textContent = s.total_applications;
      } catch (e) { showAlert('alertBox', e.message); }
    }

    async function loadUsers() {
      try {
        const users = await AdminAPI.users();
        document.getElementById('userTable').innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.full_name}</td>
            <td>${u.email}</td>
            <td>${u.phone || '-'}</td>
            <td>
              <select class="form-select form-select-sm" onchange="changeRole(${u.id}, this.value)" ${u.id === user.id ? 'disabled' : ''}>
                ${['job_seeker','recruiter','admin'].map(r =>
                  `<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`
                ).join('')}
              </select>
            </td>
            <td>${formatDate(u.created_at)}</td>
            <td>
              ${u.id !== user.id ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})">Xóa</button>` : '-'}
            </td>
          </tr>
        `).join('');
      } catch (e) { showAlert('alertBox', e.message); }
    }

    async function changeRole(id, role) {
      try {
        await AdminAPI.updateRole(id, role);
        showAlert('alertBox', 'Cập nhật role thành công.', 'success');
      } catch (e) { showAlert('alertBox', e.message); }
    }

    async function deleteUser(id) {
      if (!confirm('Xóa người dùng này? Dữ liệu liên quan cũng sẽ bị xóa.')) return;
      try {
        await AdminAPI.deleteUser(id);
        showAlert('alertBox', 'Đã xóa.', 'success');
        loadUsers();
        loadStats();
      } catch (e) { showAlert('alertBox', e.message); }
    }

    loadStats();
  </script>
</body>
</html>
