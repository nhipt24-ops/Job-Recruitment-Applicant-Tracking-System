<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Job ATS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Job ATS</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="card p-4">
      <h3 class="text-center mb-4">Đăng nhập</h3>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required placeholder="email@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" required placeholder="••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Chưa có tài khoản? <a href="/register.html">Đăng ký</a>
      </p>
      <hr>
      <p class="small text-muted mb-1"><strong>Tài khoản demo (mật khẩu: 123456)</strong></p>
      <ul class="small text-muted">
        <li>Admin: admin@ats.com</li>
        <li>Recruiter: recruiter1@company.com</li>
        <li>Ứng viên: seeker1@gmail.com</li>
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (getUser()) redirectByRole(getUser().role);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const data = await AuthAPI.login(email, password);
        setAuth(data.token, data.user);
        redirectByRole(data.user.role);
      } catch (err) {
        showAlert('alertBox', err.message, 'danger');
      }
    });
  </script>
</body>
</html>
