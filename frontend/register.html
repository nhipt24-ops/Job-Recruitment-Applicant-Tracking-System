<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Job ATS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Job ATS</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="card p-4">
      <h3 class="text-center mb-4">Đăng ký tài khoản</h3>
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input type="text" class="form-control" id="full_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="text" class="form-control" id="phone">
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Vai trò</label>
          <select class="form-select" id="role">
            <option value="job_seeker">Người tìm việc (Job Seeker)</option>
            <option value="recruiter">Nhà tuyển dụng (Recruiter)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Đã có tài khoản? <a href="/login.html">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
      };
      try {
        await AuthAPI.register(payload);
        showAlert('alertBox', 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
        setTimeout(() => window.location.href = '/login.html', 1500);
      } catch (err) {
        showAlert('alertBox', err.message, 'danger');
      }
    });
  </script>
</body>
</html>
